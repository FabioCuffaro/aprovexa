server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aprovexa}
spring.datasource.username=${POSTGRES_USER:aprovexa}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}

# V2: Flyway owns schema evolution. Hibernate must never create or update tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
# Migration bridge for local databases created by V1 Hibernate ddl-auto.
# On an empty database Flyway runs V1 and V2 normally. On a non-empty V1 schema,
# Flyway records baseline version 1 and applies V2 without deleting local data.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
