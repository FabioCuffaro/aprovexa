server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aprovexa}
spring.datasource.username=${POSTGRES_USER:aprovexa}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}

# Temporal V1 strategy. V2 replaces Hibernate schema management with versioned Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
