spring.config.import=optional:file:../.env[.properties]

server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aprovexa}
spring.datasource.username=${POSTGRES_USER:aprovexa}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}

# V2+: Flyway owns schema evolution. Hibernate must never create or update tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# V3 security. JWT_SECRET intentionally has no default: configure it outside Git.
aprovexa.security.jwt.issuer=${JWT_ISSUER:aprovexa}
aprovexa.security.jwt.secret=${JWT_SECRET}
aprovexa.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
